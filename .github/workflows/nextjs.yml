# Build TOURÉ FAMILY HERITAGE (Next.js + Prisma + Clerk).
# GitHub Pages cannot host this app: it needs a Node server, not a static export.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nextjs-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders so `next build` can compile without GitHub secrets.
      # Public/family pages skip Clerk/Prisma when these are not live keys.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /espace
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /espace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build with Next.js
        run: npm run build

  cleanup:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded failed runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/workflows/nextjs.yml/runs?status=completed&per_page=50" \
            --jq '.workflow_runs[] | select(.conclusion=="failure") | .id' \
            | while read -r id; do
                echo "Deleting failed run $id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
              done
